# Fast checks on a Linux runner: formatting, static analysis and all unit +
# widget tests. Runs on pull requests and on pushes to branches other than
# main. Pushes to main / version tags run these same checks via
# build-ios.yml (which calls this workflow before building the IPA).

name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

env:
  # Keep in sync with build-ios.yml.
  FLUTTER_VERSION: '3.47.5'

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # Infos (e.g. future deprecations) are reported but don't fail the build.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded
